networks:
  synthetic-bull-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:

  # ─── Infrastructure ──────────────────────────────────────────────────────────

  redis:
    image: redis:7.2-alpine
    command: redis-server /etc/redis/redis.conf
    volumes:
      - ./infra/redis/redis.conf:/etc/redis/redis.conf:ro
      - redis-data:/data
    networks: [synthetic-bull-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synthbull
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./infra/postgres/migrations/002_balance_history.sql:/docker-entrypoint-initdb.d/02-balance-history.sql:ro
    networks: [synthetic-bull-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d synthbull"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # ─── C++ Core ────────────────────────────────────────────────────────────────

  matching-engine:
    platform: linux/amd64
    build:
      context: ./matching-engine
      dockerfile: Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ENGINE_PORT: "9000"
      STOCKS_CONFIG: /shared/stocks.yaml
    volumes:
      - ./shared/config/stocks.yaml:/shared/stocks.yaml:ro
    networks: [synthetic-bull-net]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  trigger-engine:
    build:
      context: ./trigger-engine
      dockerfile: Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ENGINE_HOST: matching-engine
      ENGINE_PORT: "9000"
      STOCKS_CONFIG: /shared/stocks.yaml
    env_file: .env
    volumes:
      - ./shared/config/stocks.yaml:/shared/stocks.yaml:ro
    networks: [synthetic-bull-net]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      matching-engine:
        condition: service_healthy
    restart: unless-stopped

  market-generator:
    build:
      context: ./market-generator
      dockerfile: Dockerfile
    environment:
      ENGINE_HOST: matching-engine
      ENGINE_PORT: "9000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      STOCKS_CONFIG: /shared/stocks.yaml
    volumes:
      - ./shared/config/stocks.yaml:/shared/stocks.yaml:ro
    networks: [synthetic-bull-net]
    depends_on:
      redis:
        condition: service_healthy
      matching-engine:
        condition: service_healthy
    restart: unless-stopped

  # ─── Python Services ─────────────────────────────────────────────────────────

  candle-service:
    build:
      context: ./candle-service
      dockerfile: Dockerfile
    env_file: .env
    environment:
      STOCKS_CONFIG: /shared/config/stocks.yaml
    volumes:
      - ./shared:/shared:ro
    networks: [synthetic-bull-net]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  websocket-service:
    build:
      context: ./websocket-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      STOCKS_CONFIG: /shared/stocks.yaml
      WS_PORT: "8001"
    volumes:
      - ./shared/config/stocks.yaml:/shared/stocks.yaml:ro
    networks: [synthetic-bull-net]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      STOCKS_CONFIG: /shared/config/stocks.yaml
    volumes:
      - ./shared:/shared:ro
    networks: [synthetic-bull-net]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      matching-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  market-maker-bot:
    build:
      context: ./market-maker-bot
      dockerfile: Dockerfile
    env_file: .env
    environment:
      API_GATEWAY_URL: http://api-gateway:8000
      BOT_USERNAME: marketmaker
      BOT_PASSWORD: ${MM_BOT_PASSWORD}
      STOCKS_CONFIG: /shared/stocks.yaml
    volumes:
      - ./shared/config/stocks.yaml:/shared/stocks.yaml:ro
    networks: [synthetic-bull-net]
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

  alpha-bot:
    build:
      context: ./alpha-bot
      dockerfile: Dockerfile
    env_file: .env
    environment:
      API_GATEWAY_URL: http://api-gateway:8000
      BOT_USERNAME: alphabot
      BOT_PASSWORD: ${ALPHA_BOT_PASSWORD}
      STOCKS_CONFIG: /shared/stocks.yaml
    volumes:
      - ./shared/config/stocks.yaml:/shared/stocks.yaml:ro
    networks: [synthetic-bull-net]
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped
