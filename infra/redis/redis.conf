# Synthetic-Bull Redis configuration

# Persistence (light RDB snapshots)
save 900 1
save 300 10
save 60 10000

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Streams: keep last 100k entries in stream:trades (trimmed on XADD)
# Actual trimming done in application layer via MAXLEN

# Enable keyspace notifications (for future use)
notify-keyspace-events ""

# Logging
loglevel notice

# Bind to all interfaces inside container
bind 0.0.0.0

# No password needed inside private Docker network
# requirepass your-redis-password
