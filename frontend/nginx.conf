events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 3000;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Enable gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

        # Landing page routes - try files, fallback to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # React Router routes for terminal app
        # Anything starting with /terminal, /trading-charts, or /portfolio goes to terminal.html
        location ~ ^/(terminal|trading-charts|portfolio) {
            try_files $uri $uri/ /terminal.html;
        }

        # Serve static assets
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Cache other static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
